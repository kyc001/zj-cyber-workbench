appId: io.github.zj-security.workbench
productName: ZJ
artifactName: ZJ-${version}-win-${arch}-${name}.${ext}
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../dist/zj-core.exe
    to: sidecar/zj-core.exe
asar: true
win:
  target:
    - portable
  requestedExecutionLevel: asInvoker
