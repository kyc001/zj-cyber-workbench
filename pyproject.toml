[project]
name = "zj-cyber-workbench"
version = "0.1.0"
description = "Python control plane for the ZJ cyber operations workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.1",
  "aiomysql>=0.2,<1",
  "aiosqlite>=0.21,<1",
  "asyncssh==2.21.1",
  "cryptography==48.0.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "lightrag-hku==1.5.4",
  "networkx==3.6.1",
  "openai==2.38.0",
  "openai-agents==0.17.4",
  "pandas==2.3.3",
  "pypdf==6.6.0",
  "pypinyin==0.55.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.29",
  "pyjwt==2.13.0",
  "pyyaml==6.0.3",
  "redis>=5,<8",
  "requests==2.34.2",
  "sqlmodel==0.0.38",
  "sse-starlette==3.4.4",
  "tiktoken==0.13.0",
  "uvicorn==0.48.0",
  "websockets==16.0",
  "xlsxwriter==3.2.9",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.14,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["Z3r0"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
